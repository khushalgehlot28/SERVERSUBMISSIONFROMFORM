<!DOCTYPE html>
<html lang="en" class="h-full bg-[#030A10] text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        theme: {
                            dark: '#001E2B',
                            darker: '#00141E',
                            green: '#00ED64',
                            greenHover: '#00C853',
                            slate: '#1C2D37',
                            border: '#2C3E50',
                        }
                    },
                    boxShadow: {
                        'theme-glow': '0 0 25px -5px rgba(0, 237, 100, 0.15)',
                        'theme-focus': '0 0 0 3px rgba(0, 237, 100, 0.25)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #02080D;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 237, 100, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 30, 43, 0.6) 0px, transparent 50%);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Subtle ambient grid effect */
        .bg-grid {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        .animate-pulse-slow {
            animation: pulseGlow 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8 bg-grid relative overflow-x-hidden">

    <!-- Ambient glowing blur backdrop -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-theme-green/10 rounded-full blur-3xl pointer-events-none animate-pulse-slow"></div>

    <!-- MAIN FORM CONTAINER -->
    <div class="w-full max-w-lg relative z-10">
        
        <!-- Outer Glassmorphic Card -->
        <div class="bg-theme-dark/80 backdrop-blur-xl border border-theme-border/60 rounded-2xl p-6 sm:p-8 shadow-2xl shadow-black/60 relative overflow-hidden">
            
            <!-- Branding Header Badge -->
            <div class="flex items-center justify-between border-b border-theme-border/50 pb-5 mb-6">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-theme-green/10 border border-theme-green/20 flex items-center justify-center text-theme-green">
                        <i class="fa-solid fa-paper-plane text-base"></i>
                    </div>
                    <div>
                        <span class="text-xs font-semibold tracking-wider uppercase text-theme-green/90 block">Get In Touch</span>
                        <h1 class="text-xl font-bold text-white">Contact Us</h1>
                    </div>
                </div>
                <!-- Status Badge -->
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    Live API
                </span>
            </div>

            <p class="text-slate-400 text-sm mb-6">Send us a message and we will respond as soon as possible.</p>

            <form id="contactForm" class="space-y-5" novalidate>
                
                <!-- Full Name Field -->
                <div class="space-y-1.5">
                    <label for="fullName" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
                        Full Name <span class="text-theme-green">*</span>
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-regular fa-user text-sm"></i>
                        </div>
                        <input 
                            type="text" 
                            id="fullName" 
                            required 
                            placeholder="Alex Mercer"
                            class="w-full pl-10 pr-4 py-3 bg-theme-darker/80 border border-theme-border/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-theme-green focus:ring-1 focus:ring-theme-green transition-all duration-200"
                        >
                    </div>
                </div>

                <!-- Email Field -->
                <div class="space-y-1.5">
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
                        Email Address <span class="text-theme-green">*</span>
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-regular fa-envelope text-sm"></i>
                        </div>
                        <input 
                            type="email" 
                            id="email" 
                            required 
                            placeholder="alex@example.com"
                            class="w-full pl-10 pr-4 py-3 bg-theme-darker/80 border border-theme-border/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-theme-green focus:ring-1 focus:ring-theme-green transition-all duration-200"
                        >
                    </div>
                </div>

                <!-- Message Field -->
                <div class="space-y-1.5">
                    <label for="message" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
                        Message <span class="text-theme-green">*</span>
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute top-3.5 left-0 pl-3.5 flex items-start pointer-events-none text-slate-500">
                            <i class="fa-regular fa-comment text-sm"></i>
                        </div>
                        <textarea 
                            id="message" 
                            rows="4" 
                            required 
                            placeholder="Write your message here..."
                            class="w-full pl-10 pr-4 py-3 bg-theme-darker/80 border border-theme-border/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-theme-green focus:ring-1 focus:ring-theme-green transition-all duration-200 resize-none"
                        ></textarea>
                    </div>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full group relative flex items-center justify-center gap-2 py-3.5 px-6 rounded-xl bg-theme-green hover:bg-theme-greenHover text-theme-dark font-bold text-sm tracking-wide transition-all duration-200 shadow-lg shadow-theme-green/10 active:scale-[0.99] disabled:opacity-70 disabled:cursor-not-allowed disabled:active:scale-100 mt-2"
                >
                    <!-- Loading Spinner (Hidden by default) -->
                    <svg id="btnSpinner" class="hidden animate-spin h-4 w-4 text-theme-dark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>

                    <i id="btnIcon" class="fa-solid fa-paper-plane text-xs transition-transform group-hover:scale-110"></i>
                    <span id="btnText">Send Message</span>
                </button>

            </form>

            <!-- Status Card / Feedback Display -->
            <div id="statusContainer" class="hidden mt-5 p-4 rounded-xl border transition-all duration-300 text-sm">
                <div class="flex items-start gap-3">
                    <div id="statusIcon" class="mt-0.5 text-base flex-shrink-0"></div>
                    <div class="flex-1">
                        <h4 id="statusTitle" class="font-semibold text-xs uppercase tracking-wider mb-0.5"></h4>
                        <p id="status" class="text-slate-300 text-xs leading-relaxed break-all"></p>
                    </div>
                </div>
            </div>

            <!-- Footer micro-text -->
            <div class="mt-6 pt-4 border-t border-theme-border/40 flex items-center justify-between text-[11px] text-slate-500">
                <span class="flex items-center gap-1">
                    <i class="fa-solid fa-lock text-[10px]"></i> Encrypted Transmission
                </span>
                <span>Secure Data Payload</span>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // UI Elements
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnIcon = document.getElementById('btnIcon');
            const btnText = document.getElementById('btnText');
            
            const statusContainer = document.getElementById('statusContainer');
            const statusEl = document.getElementById('status');
            const statusTitle = document.getElementById('statusTitle');
            const statusIcon = document.getElementById('statusIcon');

            // Reset status state UI
            statusContainer.classList.add('hidden');
            statusContainer.className = 'mt-5 p-4 rounded-xl border transition-all duration-300 text-sm';
            
            // Set loading button state
            submitBtn.disabled = true;
            btnSpinner.classList.remove('hidden');
            btnIcon.classList.add('hidden');
            btnText.textContent = 'Sending Message...';

            const payload = {
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                message: document.getElementById('message').value.trim()
            };

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Fallback for preview mode
                let data;
                try {
                    data = await res.json();
                } catch (e) {
                    data = {
                        success: res.ok,
                        message: res.ok ? 'Message sent successfully!' : 'Request completed with status ' + res.status,
                        submissionId: 'ref_' + Math.random().toString(36).substr(2, 9)
                    };
                }

                statusContainer.classList.remove('hidden');

                if (res.ok && data.success) {
                    // Success UI Display
                    statusContainer.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300');
                    statusIcon.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
                    statusTitle.textContent = 'Success';
                    statusTitle.className = 'font-semibold text-xs uppercase tracking-wider mb-0.5 text-emerald-400';
                    statusEl.textContent = `${data.message || 'Message sent.'} Ref ID: ${data.submissionId || 'N/A'}`;
                    
                    document.getElementById('contactForm').reset();
                } else {
                    // Server error message UI
                    statusContainer.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-300');
                    statusIcon.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-400"></i>';
                    statusTitle.textContent = 'Error';
                    statusTitle.className = 'font-semibold text-xs uppercase tracking-wider mb-0.5 text-rose-400';
                    statusEl.textContent = data.error || 'Submission failed. Please verify fields and try again.';
                }
            } catch (err) {
                // Network / Local disconnect UI Display
                statusContainer.classList.remove('hidden');
                statusContainer.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-300');
                statusIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-400"></i>';
                statusTitle.textContent = 'Connection Error';
                statusTitle.className = 'font-semibold text-xs uppercase tracking-wider mb-0.5 text-rose-400';
                statusEl.textContent = 'Server/Network Error. Unable to establish connection to endpoint.';
            } finally {
                // Reset submit button state
                submitBtn.disabled = false;
                btnSpinner.classList.add('hidden');
                btnIcon.classList.remove('hidden');
                btnText.textContent = 'Send Message';
            }
        });
    </script>
</body>
</html>
